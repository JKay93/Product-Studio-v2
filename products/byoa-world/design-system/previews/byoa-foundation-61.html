<div id="byoa-foundation-61">
<style>
#byoa-foundation-61{color-scheme:light dark;font-family:system-ui,sans-serif;font-size:14px;line-height:1.5;--b-canvas:light-dark(#f3f5f2,#151c18);--b-surface:light-dark(#fff,#202922);--b-text:light-dark(#233128,#edf2ed);--b-muted:light-dark(#56665b,#b3c2b7);--b-line:light-dark(#ccd6cf,#516054);--b-accent:light-dark(#246044,#add5b9);--b-onaccent:light-dark(#fff,#183421);--b-danger:light-dark(#a02e25,#ffb9b0);color:var(--b-text)}
#byoa-foundation-61 *{box-sizing:border-box}#byoa-foundation-61 [hidden]{display:none!important}#byoa-foundation-61 .b-app{background:var(--b-canvas);border:1px solid var(--b-line);border-radius:12px;min-height:690px;overflow-wrap:anywhere}#byoa-foundation-61 .b-top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding:16px 24px;background:var(--b-surface);border-bottom:1px solid var(--b-line);border-radius:12px 12px 0 0}#byoa-foundation-61 .b-brand{font-size:20px;font-weight:500;letter-spacing:-.025em}#byoa-foundation-61 .b-subtle{color:var(--b-muted);font-size:12px}#byoa-foundation-61 .b-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}#byoa-foundation-61 .b-body{display:grid;grid-template-columns:220px minmax(0,1fr)}#byoa-foundation-61 .b-nav{padding:24px 16px;border-right:1px solid var(--b-line)}#byoa-foundation-61 .b-nav summary{display:none}#byoa-foundation-61 .b-nav .b-name{font-weight:500;margin:0 0 4px}#byoa-foundation-61 .b-nav button{width:100%;text-align:left;margin-top:8px}#byoa-foundation-61 .b-nav button[aria-current=page]{background:var(--b-accent);color:var(--b-onaccent);border-color:var(--b-accent)}#byoa-foundation-61 .b-main{padding:32px;min-width:0;max-width:820px;width:100%;margin:auto}#byoa-foundation-61 h2{font-size:26px;line-height:1.25;font-weight:500;margin:0 0 8px}#byoa-foundation-61 h3{font-size:18px;font-weight:500;margin:0 0 8px}#byoa-foundation-61 p{margin:0 0 20px}#byoa-foundation-61 button{font:inherit;min-height:44px;padding:9px 14px;color:var(--b-text);background:var(--b-surface);border:1px solid var(--b-line);border-radius:7px}#byoa-foundation-61 button.b-primary{color:var(--b-onaccent);background:var(--b-accent);border-color:var(--b-accent)}#byoa-foundation-61 button:disabled{opacity:.55}#byoa-foundation-61 label{display:block;font-weight:500;margin:20px 0 6px}#byoa-foundation-61 input,#byoa-foundation-61 textarea{font:inherit;font-size:16px;color:var(--b-text);background:var(--b-surface);border:1px solid var(--b-line);border-radius:7px;padding:12px;width:100%;display:block}#byoa-foundation-61 textarea{resize:vertical;min-height:255px;line-height:1.6}#byoa-foundation-61 .b-editor-header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:24px}#byoa-foundation-61 .b-editor-header h2{font-size:20px}#byoa-foundation-61 .b-savebar{margin-top:16px;justify-content:space-between}#byoa-foundation-61 .b-feedback{margin:16px 0;padding:16px;background:var(--b-surface);border:1px solid var(--b-line);border-radius:7px}#byoa-foundation-61 .b-feedback p{margin:0 0 12px}#byoa-foundation-61 .b-error{color:var(--b-danger)}#byoa-foundation-61 .b-list{display:grid;gap:8px;margin-top:24px}#byoa-foundation-61 .b-list button{text-align:left;padding:16px;display:flex;justify-content:space-between;gap:12px;align-items:center}#byoa-foundation-61 .b-list small{display:block;color:var(--b-muted);margin-top:4px;font-size:12px}#byoa-foundation-61 .b-empty{padding:36px 0}#byoa-foundation-61 .b-empty p{max-width:420px}#byoa-foundation-61 .b-foot{padding:12px 24px;border-top:1px solid var(--b-line);color:var(--b-muted);font-size:12px}#byoa-foundation-61 .b-modal{max-width:460px;width:calc(100% - 32px);background:var(--b-surface);color:var(--b-text);border:1px solid var(--b-line);border-radius:10px;padding:24px}#byoa-foundation-61 .b-modal::backdrop{background:light-dark(#23312866,#0009)}#byoa-foundation-61 .b-modal h3{margin-top:0}#byoa-foundation-61 .b-modal p{margin-bottom:16px}#byoa-foundation-61 .b-compact .b-body{display:block}#byoa-foundation-61 .b-compact .b-nav{padding:12px 24px;border-right:0;border-bottom:1px solid var(--b-line)}#byoa-foundation-61 .b-compact .b-nav nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#byoa-foundation-61 .b-compact .b-nav button{width:auto;margin:0}#byoa-foundation-61 .b-compact .b-nav .b-owner{display:none}#byoa-foundation-61 .b-compact .b-main{padding:24px}#byoa-foundation-61 .b-compact .b-list{gap:0}#byoa-foundation-61 .b-compact .b-list button{border-radius:0}#byoa-foundation-61 .b-narrow{max-width:380px;margin:auto}#byoa-foundation-61 .b-narrow .b-body{display:block}#byoa-foundation-61 .b-narrow .b-nav{border-right:0;border-bottom:1px solid var(--b-line);padding:12px 16px}#byoa-foundation-61 .b-narrow .b-nav summary{display:block;min-height:44px;padding:9px 0}#byoa-foundation-61 .b-narrow .b-main{padding:20px}#byoa-foundation-61 .b-narrow .b-top{padding:16px}#byoa-foundation-61 .b-narrow .b-list button{flex-wrap:wrap}#byoa-foundation-61 .b-narrow .b-nav nav{display:block}#byoa-foundation-61 .b-narrow .b-nav button{width:100%;margin-top:8px}
@media(max-width:700px){#byoa-foundation-61 .b-body{display:block}#byoa-foundation-61 .b-nav,#byoa-foundation-61 .b-compact .b-nav{border-right:0;border-bottom:1px solid var(--b-line);padding:12px 16px}#byoa-foundation-61 .b-nav summary{display:block;min-height:44px;padding:9px 0}#byoa-foundation-61 .b-main,#byoa-foundation-61 .b-compact .b-main{padding:20px}#byoa-foundation-61 .b-top{padding:16px}#byoa-foundation-61 .b-nav nav,#byoa-foundation-61 .b-compact .b-nav nav{display:block}#byoa-foundation-61 .b-nav button,#byoa-foundation-61 .b-compact .b-nav button{width:100%;margin-top:8px}#byoa-foundation-61 .b-list button{flex-wrap:wrap}}
</style>
<div class="viz-carousel" aria-label="World foundation appearance options">
<section data-variant="Calm workspace" aria-label="Calm workspace recommendation"><div class="b-app" aria-label="Calm World workspace"></div></section>
<section data-variant="Compact utility" aria-label="Compact utility alternative" hidden><div class="b-app b-compact" aria-label="Compact World workspace"></div></section>
</div>
</div>
<script>
(()=>{
const root=document.getElementById('byoa-foundation-61');
root.querySelectorAll('.b-app').forEach(app=>{
const design={scenario:'Saved note',formExample:'Normal',narrow:false};
const seed=()=>[{id:'w-garden',name:'Garden project',notes:[{id:'n-plan',title:'A first plan',body:'Plan a small shared garden.\n\nStart with a sunny corner, choose three easy crops, and list the supplies.\n\nNext: sketch the space and estimate the materials.',revision:1}]},{id:'w-reading',name:'Reading group',notes:[]}];
let worlds=seed(),active='w-garden',noteId='n-plan',page='editor',draft={title:'',body:''},dirty=false,phase='saved',fault=null,pending=null,focusReturn=null,serial=0,timer=null;
let createDraft='',renameDraft='Garden project',createDirty=false,renameDirty=false,formPhase='idle',formFault=null;
app.innerHTML=`<header class="b-top"><div class="b-row"><span class="b-brand">BYOA World</span><button type="button" data-worlds class="cursor-interaction">Worlds</button></div><span class="b-subtle">Local human owner</span></header><div class="b-body"><details class="b-nav" open><summary class="cursor-interaction">World navigation</summary><nav aria-label="Current World"><p class="b-name" data-world-name></p><p class="b-subtle b-owner">Owned by you locally</p><button type="button" data-notes class="cursor-interaction">Planning note</button><button type="button" data-details class="cursor-interaction">World details</button></nav></details><main class="b-main"><section data-page="worlds"><h2>Your Worlds</h2><p class="b-subtle">One project space at a time.</p><button type="button" data-create-world class="b-primary cursor-interaction">Create World</button><div class="b-list" data-world-list></div></section><section data-page="create"><h2>Create a World</h2><p class="b-subtle">A named workspace for your project.</p><form data-create><label>World name<input name="worldName" maxlength="80" required autocomplete="off" placeholder="e.g. Garden project"></label><div class="b-row" style="margin-top:20px"><button class="b-primary cursor-interaction" type="submit">Create World</button><button type="button" data-cancel-create class="cursor-interaction">Cancel</button></div></form></section><section data-page="notes"><h2 data-notes-name></h2><p class="b-subtle">One planning note for this project.</p><button type="button" data-new-note class="b-primary cursor-interaction">Start planning note</button><div class="b-list" data-note-list></div></section><section data-page="details"><h2>World details</h2><p class="b-subtle">Owner: Local human owner</p><form data-rename><label>World name<input name="rename" maxlength="80" required></label><div class="b-row" style="margin-top:20px"><button type="submit" class="b-primary cursor-interaction">Save name</button><span class="b-subtle" data-name-status aria-live="polite"></span></div></form></section><section data-page="editor"><div class="b-editor-header"><div><h2>Planning note</h2><span class="b-subtle" data-note-context></span></div><button type="button" data-back-notes class="cursor-interaction">World overview</button></div><label>Title<input data-title maxlength="120" required autocomplete="off"></label><label>Note<textarea data-body maxlength="50000" placeholder="What are you working towards?"></textarea></label><div class="b-row b-savebar"><span class="b-subtle" data-status aria-live="polite"></span><button type="button" data-save class="b-primary cursor-interaction">Save note</button></div><div class="b-feedback" data-save-error hidden role="alert"><p class="b-error">Could not save this note. Your draft is still here.</p><button type="button" data-retry-save class="cursor-interaction">Retry save</button></div><div class="b-feedback" data-conflict hidden role="alert"><p>A newer saved version is available. Your draft has not been overwritten.</p><div class="b-row"><button type="button" data-view-newer class="cursor-interaction">View saved version</button><button type="button" data-use-newer class="cursor-interaction">Load saved version</button></div><div data-newer hidden style="margin-top:16px"><h3 data-newer-title></h3><p data-newer-body style="white-space:pre-wrap"></p></div></div></section><section data-page="loading"><h2>Opening World…</h2><p class="b-subtle" aria-live="polite">Loading your saved planning note.</p></section><section data-page="load-error"><h2>Could not open this World</h2><p>The saved planning note is unavailable right now.</p><button type="button" data-retry-load class="b-primary cursor-interaction">Retry opening</button></section></main></div><footer class="b-foot">Fictional design preview · Changes last only in this preview; reload resets them.</footer><dialog class="b-modal" aria-label="Unsaved changes"><h3 data-dialog-title>Keep your changes?</h3><p data-dialog-copy>This note has unsaved changes.</p><div class="b-row"><button type="button" data-keep class="b-primary cursor-interaction" autofocus>Keep editing</button><button type="button" data-save-leave class="cursor-interaction">Save and leave</button><button type="button" data-discard class="cursor-interaction">Discard and leave</button></div></dialog>`;
const q=s=>app.querySelector(s),world=()=>worlds.find(w=>w.id===active),note=()=>world()?.notes.find(n=>n.id===noteId);
q('[data-create]').insertAdjacentHTML('beforeend','<p class="b-subtle" data-create-status aria-live="polite" style="margin-top:16px"></p><p class="b-error" data-create-error role="alert" hidden>Could not create this World. Your name is still here. Try Create World again.</p>');
q('[data-rename]').insertAdjacentHTML('beforeend','<p class="b-error" data-rename-error role="alert" hidden>Could not save the new name. Your changes are still here. Try Save name again.</p>');
function hasDraft(){return dirty||createDirty||renameDirty;}
function busy(){return phase==='saving'||formPhase==='pending';}
function discardDrafts(){dirty=false;createDirty=false;renameDirty=false;createDraft='';renameDraft=world()?.name||'';formPhase='idle';}
function loadWorld(){noteId=world()?.notes[0]?.id||'n-draft-'+(++serial);renameDraft=world()?.name||'';renameDirty=false;formPhase='idle';loadDraft();}
function row(list,title,detail,fn){const b=document.createElement('button');b.type='button';b.className='cursor-interaction';const t=document.createElement('span');t.textContent=title;const small=document.createElement('small');small.textContent=detail;t.append(small);b.append(t);b.onclick=fn;list.append(b);}
function loadDraft(){const n=note();draft={title:n?.title||'',body:n?.body||''};dirty=false;phase=n?'saved':'new';fault=null;}
function status(){q('[data-status]').textContent=phase==='saving'?'Saving…':phase==='error'?'Not saved':phase==='conflict'?'Save conflict':dirty?'Unsaved changes':phase==='new'?'Not saved yet':`Saved · Revision ${note()?.revision||1} · Preview only`;q('[data-save]').disabled=phase==='saving'||phase==='conflict';q('[data-save-error]').hidden=phase!=='error';q('[data-conflict]').hidden=phase!=='conflict';}
function render(){app.classList.toggle('b-narrow',design.narrow);app.querySelectorAll('[data-page]').forEach(el=>el.hidden=el.dataset.page!==page);q('.b-nav').hidden=['worlds','create'].includes(page);q('[data-world-name]').textContent=world()?.name||'';q('[data-notes-name]').textContent=world()?.name||'';q('[data-note-context]').textContent=world()?.name||'';q('[name=rename]').value=world()?.name||'';q('[data-title]').value=draft.title;q('[data-body]').value=draft.body;q('[data-title]').disabled=q('[data-body]').disabled=phase==='saving';q('[data-notes]').setAttribute('aria-current',['notes','editor'].includes(page)?'page':'false');q('[data-details]').setAttribute('aria-current',page==='details'?'page':'false');q('[data-newer]').hidden=true;const wl=q('[data-world-list]');wl.replaceChildren();if(!worlds.length){const p=document.createElement('p');p.className='b-empty';p.textContent='No Worlds yet. Create your first project space.';wl.append(p);}worlds.forEach(w=>row(wl,w.name,'Local human owner',()=>navigate(()=>{active=w.id;page='notes';loadDraft();})));const nl=q('[data-note-list]');nl.replaceChildren();if(world()&&!world().notes.length){const p=document.createElement('p');p.className='b-empty';p.textContent='No planning note yet. Start with a title and your first thought.';nl.append(p);}world()?.notes.forEach(n=>row(nl,n.title,`Planning note · Revision ${n.revision}`,()=>navigate(()=>{noteId=n.id;page='editor';loadDraft();})));q('[data-new-note]').hidden=!!world()?.notes.length;status();}
function formStatus(){q('[name=worldName]').value=createDraft;q('[name=rename]').value=renameDraft;q('[name=worldName]').disabled=q('[name=rename]').disabled=formPhase==='pending';q('[data-create] button[type=submit]').disabled=q('[data-rename] button[type=submit]').disabled=formPhase==='pending';q('[data-create-status]').textContent=page==='create'?(formPhase==='pending'?'Creating…':formPhase==='error'?'Not created':createDirty?'Unsaved name':''):'';q('[data-name-status]').textContent=page==='details'?(formPhase==='pending'?'Saving name…':formPhase==='error'?'Name not saved':renameDirty?'Unsaved name':formPhase==='saved'?'Name saved · Preview only':''):'';q('[data-create-error]').hidden=page!=='create'||formPhase!=='error';q('[data-rename-error]').hidden=page!=='details'||formPhase!=='error';}
function closeDialog(){q('dialog').close();focusReturn?.focus();pending=null;}
function ask(action,discardOnly=false){pending=action;focusReturn=document.activeElement;const reset=discardOnly==='reset';q('[data-dialog-title]').textContent=reset?'Reset this fictional preview?':discardOnly?'Replace your draft?':'Keep your changes?';q('[data-dialog-copy]').textContent=reset?'Changing the example resets preview data and discards your unsaved changes.':discardOnly?'Loading the saved version will discard your unsaved draft.':page==='editor'?'This note has unsaved changes.':'This World name has unsaved changes.';q('[data-save-leave]').hidden=!!discardOnly;q('[data-discard]').textContent=reset?'Discard and reset preview':discardOnly?'Discard draft and load':'Discard and leave';q('dialog').showModal();}
function navigate(action){if(busy())return;if(hasDraft()){ask(action);return;}action();render();formStatus();}
function save(done){if(phase==='saving'||phase==='conflict')return;const title=draft.title.trim();q('[data-title]').setCustomValidity(title?'':'Enter a note title.');if(!title){q('[data-title]').reportValidity();return;}if(world().notes.length&&!note()){phase='conflict';dirty=true;render();return;}phase='saving';render();timer=setTimeout(()=>{if(fault==='error'){phase='error';dirty=true;fault=null;render();return;}if(fault==='conflict'){phase='conflict';dirty=true;fault=null;render();return;}let n=note();if(!n){n={id:'n-'+(++serial),revision:0};noteId=n.id;world().notes.push(n);}Object.assign(n,{title,body:draft.body,revision:n.revision+1});draft.title=title;dirty=false;phase='saved';if(done)done();render();formStatus();},550);}
q('[data-title]').oninput=q('[data-body]').oninput=()=>{draft={title:q('[data-title]').value,body:q('[data-body]').value};dirty=true;q('[data-title]').setCustomValidity('');if(phase!=='conflict')phase='unsaved';q('[data-new-note]').hidden=!!world()?.notes.length;status();};
q('[data-worlds]').onclick=()=>navigate(()=>{page='worlds';});q('[data-create-world]').onclick=()=>navigate(()=>{page='create';createDraft='';formPhase='idle';});q('[data-cancel-create]').onclick=()=>navigate(()=>{page='worlds';});q('[data-notes]').onclick=q('[data-back-notes]').onclick=()=>navigate(()=>{page='notes';});q('[data-details]').onclick=()=>navigate(()=>{page='details';renameDraft=world().name;formPhase='idle';});q('[data-new-note]').onclick=()=>navigate(()=>{loadWorld();page='editor';});q('[data-save]').onclick=q('[data-retry-save]').onclick=()=>save();
function saveName(kind,done){if(busy())return;const input=q(kind==='create'?'[name=worldName]':'[name=rename]'),name=(kind==='create'?createDraft:renameDraft).trim();input.setCustomValidity(name?'':'Enter a World name.');if(!name){input.reportValidity();return;}formPhase='pending';formStatus();timer=setTimeout(()=>{if(formFault==='error'){formFault=null;formPhase='error';formStatus();return;}if(kind==='create'){active='w-'+(++serial);worlds.push({id:active,name,notes:[]});createDirty=false;createDraft='';page='notes';loadWorld();}else{world().name=name;renameDraft=name;renameDirty=false;formPhase='saved';}if(done)done();render();formStatus();},550);}
q('[data-create]').onsubmit=e=>{e.preventDefault();saveName('create');};q('[name=worldName]').oninput=e=>{e.target.setCustomValidity('');createDraft=e.target.value;createDirty=!!createDraft;formPhase='idle';formStatus();};
q('[data-rename]').onsubmit=e=>{e.preventDefault();saveName('rename');};q('[name=rename]').oninput=e=>{e.target.setCustomValidity('');renameDraft=e.target.value;renameDirty=renameDraft!==world().name;formPhase='idle';formStatus();};
q('[data-keep]').onclick=closeDialog;q('dialog').onclose=()=>focusReturn?.focus();q('dialog').oncancel=()=>{pending=null;};q('[data-discard]').onclick=()=>{const action=pending;discardDrafts();closeDialog();action?.();render();formStatus();};q('[data-save-leave]').onclick=()=>{const action=pending,from=page;closeDialog();if(from==='create')saveName('create',action);else if(from==='details')saveName('rename',action);else save(action);};
q('[data-view-newer]').onclick=()=>{q('[data-newer-title]').textContent=note()?.title||'A first plan';q('[data-newer-body]').textContent=note()?.body||'';q('[data-newer]').hidden=!q('[data-newer]').hidden;};q('[data-use-newer]').onclick=()=>ask(()=>{loadDraft();page='editor';},true);q('[data-retry-load]').onclick=()=>{page='loading';render();timer=setTimeout(()=>{page='notes';render();},550);};
app.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&page==='editor'){e.preventDefault();save();}});
function scenario(){clearTimeout(timer);if(q('dialog').open)closeDialog();worlds=seed();active='w-garden';noteId='n-plan';page='editor';loadDraft();createDraft='';renameDraft=world().name;createDirty=renameDirty=false;formPhase='idle';formFault=null;switch(design.scenario){case 'No Worlds':worlds=[];page='worlds';break;case 'World list':page='worlds';break;case 'Create World':page='create';break;case 'Empty World':active='w-reading';page='notes';loadWorld();break;case 'World overview':page='notes';break;case 'New note':active='w-reading';loadWorld();break;case 'Unsaved note':draft.body+='\n\nCheck the space this weekend.';dirty=true;phase='unsaved';break;case 'Saving note':phase='saving';break;case 'Save failure':draft.body+='\n\nCheck the space this weekend.';dirty=true;phase='error';break;case 'Save conflict':world().notes[0].revision=2;world().notes[0].body+='\n\nSaved elsewhere: measure the corner first.';draft.body+='\n\nMy draft: ask for seed recommendations.';dirty=true;phase='conflict';break;case 'Loading World':page='loading';break;case 'Load failure':page='load-error';break;case 'World details':page='details';break;}
if(design.formExample!=='Normal'){page=design.formExample.startsWith('Creat')?'create':'details';dirty=false;phase='saved';if(page==='create'){createDraft='Community garden';createDirty=true;}else{renameDraft='Garden project — spring';renameDirty=true;}formPhase=design.formExample==='Creating'||design.formExample==='Renaming'?'pending':'error';}
render();formStatus();}
loadDraft();render();formStatus();
let lastScenario=design.scenario,lastFormExample=design.formExample;
function changeExample(nextScenario,nextFormExample){const action=()=>{design.scenario=lastScenario=nextScenario;design.formExample=lastFormExample=nextFormExample;scenario();};if(hasDraft()){ask(action,'reset');return;}action();}
if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:()=>{app.classList.toggle('b-narrow',design.narrow);if(design.scenario!==lastScenario||design.formExample!==lastFormExample){const sceneChanged=design.scenario!==lastScenario,nextScenario=sceneChanged?design.scenario:'Saved note',nextFormExample=sceneChanged?'Normal':design.formExample;design.scenario=lastScenario;design.formExample=lastFormExample;changeExample(nextScenario,nextFormExample);}}});tweak.addSelect(design,'scenario',{label:'Preview example (resets data)',options:['Saved note','No Worlds','Create World','Empty World','New note','Unsaved note','Saving note','Save failure','Save conflict','Loading World','Load failure','World details']});tweak.addSelect(design,'formExample',{label:'World name example (resets data)',options:['Normal','Creating','Create failure','Renaming','Rename failure']});tweak.addToggle(design,'narrow',{label:'Narrow screen'});}
app.foundationPreview={setScenario:value=>changeExample(value,'Normal'),setFormExample:value=>changeExample('Saved note',value),getState:()=>({page,dirty,phase,createDirty,renameDirty,createDraft,renameDraft,formPhase,draft:{...draft},worlds:JSON.parse(JSON.stringify(worlds))})};
});
})();
</script>
